name: Job Maintenance & Discovery

on:
  schedule:
    # Runs once a week: every Sunday at 3:00 AM UTC
    - cron: "0 3 * * 0"
  workflow_dispatch:
    inputs:
      source:
        description: "Run discovery/prune for a specific source only (optional)"
        type: string
        required: false
        default: ""

jobs:
  maintenance:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up UV and Python
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          version: "latest"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: ".python-version"

      - name: Install dependencies
        run: uv sync

      - name: Run Discover and Prune if config.json exists
        run: |
          if [ ! -f "config/config.json" ]; then
            echo "config/config.json does not exist. Skipping maintenance tasks."
            exit 0
          fi

          SOURCE_FLAG=""
          if [ "${{ github.event_name }}" == "workflow_dispatch" ] && [ -n "${{ inputs.source }}" ]; then
            SOURCE_FLAG="--source ${{ inputs.source }}"
          fi

          echo "Running discovery..."
          uv run jobhunter discover --write $SOURCE_FLAG

          echo "Running pruning..."
          uv run jobhunter prune --write $SOURCE_FLAG

      - name: Commit and push updated config.json
        run: |
          if [ ! -f "config/config.json" ]; then
            exit 0
          fi

          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git status

          if [ -f "config/config.json" ]; then
            git add config/config.json
          fi

          if git diff --staged --quiet; then
            echo "No changes in config.json to commit."
          else
            git commit -m "chore(maintenance): update company board configuration [skip ci]"
            git push
          fi
