name: discover-companies

# Weekly workflow to automatically discover new company job boards
# and remove inactive ones from config.json.
# NOTE: Requires config.json to be committed in the repository.

on:
  schedule:
    - cron: "41 3 * * 1" # Mondays at 03:41 UTC
  workflow_dispatch: # Allows manual trigger from Actions tab

concurrency:
  group: job-hunter # Prevents overlapping with the main job-hunter workflow
  cancel-in-progress: false

permissions:
  contents: write # Allows workflow to commit updates to config.json

jobs:
  discover:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the optional search package
        run: python -m pip install ddgs

      - name: Find new companies
        if: hashFiles('config.json') != ''
        # Handles search engine rate limits gracefully by saving whatever it finds before stopping
        run: python -m jobhunter discover --write

      - name: Remove companies that no longer exist
        if: hashFiles('config.json') != ''
        run: |
          python -m jobhunter fetch --no-boards --ignore-seen || true
          python -m jobhunter prune

      - name: Commit config.json if it changed
        if: hashFiles('config.json') != ''
        run: |
          git config user.name "job-hunter-bot"
          git config user.email "job-hunter-bot@users.noreply.github.com"
          git add config.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: update company list"
            git push
          fi
