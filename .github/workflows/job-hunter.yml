name: job-hunter

on:
  schedule:
    # Egypt time (UTC+3) schedules:
    - cron: "16 5 * * *" # 08:00 AM (Morning full run)
    - cron: "16 10 * * *" # 01:00 PM (Midday company-only)
    - cron: "16 15 * * *" # 06:00 PM (Evening company-only)
  workflow_dispatch: # Allows manual trigger from Actions tab
    inputs:
      no_boards:
        description: "Skip aggregator boards: fetch listed companies only"
        type: boolean
        default: false
      dry_run:
        description: "Dry run: print the Telegram messages in the log, send nothing, save nothing"
        type: boolean
        default: false

concurrency:
  group: job-hunter
  cancel-in-progress: false

permissions:
  contents: write # Allows workflow to commit seen.json

jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Fallback to repository secrets for personal config files
      - name: Write personal files from secrets
        env:
          CV_MD: ${{ secrets.CV_MD }}
          PREFERENCES_MD: ${{ secrets.PREFERENCES_MD }}
          CONFIG_JSON: ${{ secrets.CONFIG_JSON }}
        run: |
          if [ -n "$CV_MD" ]; then printf '%s\n' "$CV_MD" > cv.md; fi
          if [ -n "$PREFERENCES_MD" ]; then printf '%s\n' "$PREFERENCES_MD" > preferences.md; fi
          if [ -n "$CONFIG_JSON" ]; then printf '%s\n' "$CONFIG_JSON" > config.json; fi

      # Safety net: warns if cv or preferences are committed in a public repository
      - name: Warn if personal files are public
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          private=$(gh api "repos/$GITHUB_REPOSITORY" --jq .private 2>/dev/null || echo unknown)
          if [ "$private" = "false" ]; then
            for f in cv.md preferences.md; do
              if git ls-files --error-unmatch "$f" >/dev/null 2>&1; then
                echo "::warning title=Personal file in a PUBLIC repository::$f is committed in a public repo. Make the repo private, or move it to a repository secret and remove it from git history."
              fi
            done
          fi

      - name: Check setup
        run: python -m jobhunter doctor || true # Informational: logs missing setup items

      # Fetch jobs based on schedule type or manual input
      - name: Fetch jobs
        run: python -m jobhunter fetch ${{ ((github.event_name == 'schedule' && github.event.schedule != '16 5 * * *') || inputs.no_boards) && '--no-boards' || '' }}

      # always() ensures subsequent steps run even if fetch fails
      - name: Evaluate jobs
        if: always()
        run: python -m jobhunter evaluate

      - name: Send to Telegram
        if: always()
        run: python -m jobhunter send ${{ inputs.dry_run && '--dry-run' || '' }}

      - name: Save seen jobs to main branch
        if: always() && !inputs.dry_run
        run: |
          git config user.name "job-hunter-bot"
          git config user.email "job-hunter-bot@users.noreply.github.com"

          git add data/seen.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: update seen jobs"
            git push
          fi
