name: job-hunter

on:
  schedule:
    # Egypt is UTC+3 (EEST). Times are in UTC:
    - cron: "16 5 * * *" # 08:00 AM EEST (Morning full run)
    - cron: "16 10 * * *" # 01:00 PM EEST (Midday company-only)
    - cron: "16 15 * * *" # 06:00 PM EEST (Evening company-only)
  workflow_dispatch: # lets you run it by hand from the Actions tab
    inputs:
      no_boards:
        description: "Skip aggregator boards: fetch listed companies only"
        type: boolean
        default: false
      dry_run:
        description: "Dry run: print the Telegram messages in the log, send nothing, save nothing"
        type: boolean
        default: false

concurrency:
  group: job-hunter
  cancel-in-progress: false

permissions:
  contents: write # lets the last step commit data/seen.json

jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Personal files can live in repository secrets instead of the repo. That is the safe way to run a PUBLIC fork.
      # Each secret is optional: if it is not set, the file from the repository is used.
      - name: Write personal files from secrets
        env:
          CV_MD: ${{ secrets.CV_MD }}
          PREFERENCES_MD: ${{ secrets.PREFERENCES_MD }}
          CONFIG_JSON: ${{ secrets.CONFIG_JSON }}
        run: |
          if [ -n "$CV_MD" ]; then printf '%s\n' "$CV_MD" > cv.md; fi
          if [ -n "$PREFERENCES_MD" ]; then printf '%s\n' "$PREFERENCES_MD" > preferences.md; fi
          if [ -n "$CONFIG_JSON" ]; then printf '%s\n' "$CONFIG_JSON" > config.json; fi

      - name: Restore seen.json from state branch
        run: |
          mkdir -p data
          git fetch origin state || true
          git checkout origin/state -- data/seen.json 2>/dev/null || echo "No previous state found."

      - name: Check setup
        run: python -m jobhunter doctor || true # informational: shows what is missing in the log

      # Check if triggered by scheduled other than 08:16 UTC cron, or if no_boards input is checked
      - name: Fetch jobs
        run: python -m jobhunter fetch ${{ ((github.event_name == 'schedule' && github.event.schedule != '16 5 * * *') || inputs.no_boards == 'true') && '--no-boards' || '' }}

      # if: always() on the next steps: an earlier failure must still reach the Telegram alert,
      # and must not lose the progress already recorded in seen.json.
      - name: Evaluate jobs
        if: always()
        run: python -m jobhunter evaluate

      - name: Send to Telegram
        if: always()
        run: python -m jobhunter send ${{ inputs.dry_run && '--dry-run' || '' }}

      - name: Save seen jobs to state branch
        if: always() && !inputs.dry_run
        run: |
          git config user.name "job-hunter-bot"
          git config user.email "job-hunter-bot@users.noreply.github.com"

          # Backup the generated file outside the git working tree
          cp data/seen.json /tmp/seen.json

          # Fetch and switch to the state branch, or create it as an empty branch if it doesn't exist
          git fetch origin state || true
          git checkout state 2>/dev/null || git checkout --orphan state

          # Clear out all files from the main branch on this working tree
          git rm -rf . 2>/dev/null || true

          # Bring back only seen.json
          mkdir -p data
          cp /tmp/seen.json data/seen.json

          git add data/seen.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: update seen jobs"
            git push origin state
          fi
