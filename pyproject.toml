[project]
name = "jobhunter"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [{ name = "ziad-aboughaleb", email = "ziadaboughaleb@gmail.com" }]
requires-python = ">=3.14"
dependencies = [
  "ddgs>=9.16.1",
  "httpx>=0.28.1",
  "pydantic>=2.14.1",
  "pydantic-settings>=2.16.1",
  "rich>=15.0.0",
  "typer>=0.27.3",
]

[dependency-groups]
dev = ["ruff>=0.17.2"]

[project.scripts]
jobhunter = "jobhunter.main:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

# ruff formater settings
[tool.ruff]
line-length = 160
indent-width = 2

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP", "SIM", "RUF"]
ignore = ["RUF012"]

fixable = ["ALL"]
unfixable = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
