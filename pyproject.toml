[project]
name = "jobhunter-cli"
version = "0.1.0"
description = "An AI-powered, zero-database Python CLI that automates job hunting. It scrapes ATS boards, evaluates candidate-job fit using LLMs against your CV, and dispatches real-time Telegram alerts."
readme = "README.md"
authors = [{ name = "ziad-aboughaleb", email = "ziadaboughaleb@gmail.com" }]
requires-python = ">=3.14"
dependencies = [
  "ddgs>=9.16.1",
  "filelock>=4.2.4",
  "httpx>=0.28.1",
  "openai>=3.41.0",
  "pydantic>=2.14.1",
  "pydantic-settings>=2.16.1",
  "rich>=15.0.0",
  "typer>=0.27.3",
]

[dependency-groups]
dev = ["ruff>=0.17.2"]

[project.scripts]
jobhunter = "jobhunter.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jobhunter"]

# ruff formater settings
[tool.ruff]
line-length = 999
indent-width = 2

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP", "SIM", "RUF"]
ignore = ["RUF012"]

fixable = ["ALL"]
unfixable = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
